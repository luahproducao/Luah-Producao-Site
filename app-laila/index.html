<style>

:root{
  --bg:#F6F1EA; --surface:#FFFFFF; --ink:#1F2A2B; --muted:#5E6B6A; --line:#E4DCD1;
  --accent:#0E6F6A; --accent-soft:#DDEFEC; --accent-ink:#FFFFFF;
  --sun:#D9714E; --sun-soft:#F8E3D9;
  --ok:#2A7A58; --ok-soft:#DDF0E6; --warn:#955700; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#FADDDA;
  --hero:#123A3A; --hero-ink:#FFFFFF; --hero-muted:#BFD9D6;
  --serif:'Cormorant Garamond',Georgia,serif; --body:'DM Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1717; --surface:#182222; --ink:#EEF3F2; --muted:#A7B6B4; --line:#2B3A39;
  --accent:#5CC2BA; --accent-soft:#16332F; --accent-ink:#0B1414; --sun:#F09A7A; --sun-soft:#3A2219;
  --ok:#6FD0A2; --ok-soft:#1D3A2E; --warn:#F2BC63; --warn-soft:#3B2D12; --bad:#FF8C84; --bad-soft:#44201E;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:16px max(16px,env(safe-area-inset-right)) 104px max(16px,env(safe-area-inset-left))}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1,h2{font-family:var(--serif);font-weight:600}
h1{font-size:34px} h2{font-size:28px} h3{font-size:17px;font-weight:700}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--serif);font-size:24px;font-weight:600}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:22px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat .v{font-family:var(--serif);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .d{font-size:13px;font-weight:700}
.up{color:var(--ok)} .down{color:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.pill.sun{background:var(--sun-soft);color:var(--sun)}

.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:0 0 auto}
.item.done .t{text-decoration:line-through;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input.in,select.in{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;cursor:pointer}
.drop:hover{border-color:var(--accent)}
.thumb{max-height:220px;border-radius:12px;display:block;margin:10px auto 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.tip{font-size:13px;color:var(--muted);min-height:1.5em}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted)} td.n{text-align:right;font-variant-numeric:tabular-nums}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.bottom .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}

nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current=page]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--hero);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
.status{font-size:13px;color:var(--muted)}

/* ============ ESTADO (salvo só neste aparelho) ============ */
var KEY = "luah-app-" + CLIENTE.nome.toLowerCase().replace(/\W+/g, "-");
var S = load();
function load() {
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return {v: 1, leituras: SEMENTE.leituras.slice(), pautas: {}, metas: {}, feitos: {}, extras: []};
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); flash("Salvo"); } catch (e) { flash("Não foi possível salvar neste aparelho"); }
}
function flash(t) { var el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(function () { el.hidden = true; }, 1600); }

/* ============ UTILIDADES ============ */
function el(tag, attrs, kids) {

  return e;
}
function n(v) { return v == null || isNaN(v) ? "—" : Math.round(v).toLocaleString("pt-BR"); }
function dBR(iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; }
function hoje() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function serie(rede, campo) {
  return S.leituras.filter(function (l) { return l.rede === rede && l[campo] != null; })
    .sort(function (a, b) { return a.data < b.data ? -1 : 1; });
}
function ultimo(rede, campo) { var s = serie(rede, campo); return s.length ? s[s.length - 1][campo] : null; }
function variacao(rede, campo) {
  var s = serie(rede, campo); if (s.length < 2) return null;
  return {d: s[s.length - 1][campo] - s[s.length - 2][campo], desde: s[s.length - 2].data};
}

/* ============ GRÁFICO DE LINHA (sem bibliotecas) ============ */
function linha(series, opts) {
  var W = 640, H = 220, m = {t: 14, r: 16, b: 26, l: 48};
  var pts = [].concat.apply([], series.map(function (s) { return s.pts; }));
  var box = el("div", {class: "chart"});
  if (pts.length < 2 || new Set(pts.map(function (p) { return p.x; })).size < 2) {
    box.append(el("p", {class: "muted small", text: "A linha aparece a partir da segunda leitura. Importe um print novo na próxima semana."}));
    return box;
  }
  var xs = pts.map(function (p) { return new Date(p.x).getTime(); }), ys = pts.map(function (p) { return p.y; });
  var x0 = Math.min.apply(0, xs), x1 = Math.max.apply(0, xs), y1 = Math.max.apply(0, ys) * 1.1, y0 = opts && opts.zero === false ? Math.min.apply(0, ys) * 0.9 : 0;
  var X = function (v) { return m.l + (new Date(v).getTime() - x0) / (x1 - x0) * (W - m.l - m.r); };
  var Y = function (v) { return H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b); };
  var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", (opts && opts.label) || "Evolução");
  function add(t, a, txt) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.append(e); return e; }
  for (var i = 0; i <= 4; i++) { var v = y0 + (y1 - y0) * i / 4; add("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--line)"}); add("text", {x: m.l - 6, y: Y(v) + 4, "text-anchor": "end"}, n(v)); }
  var cores = ["var(--accent)", "var(--sun)"], tip = el("div", {class: "tip"});
  series.forEach(function (s, si) {
    add("path", {d: s.pts.map(function (p, i) { return (i ? "L" : "M") + X(p.x) + "," + Y(p.y); }).join(""), fill: "none", stroke: cores[si % 2], "stroke-width": 2.5});
    s.pts.forEach(function (p) {
      var c = add("circle", {cx: X(p.x), cy: Y(p.y), r: 5, fill: cores[si % 2]});
      var f = function () { tip.textContent = s.nome + " · " + dBR(p.x) + ": " + n(p.y); };
      c.addEventListener("pointerenter", f); c.addEventListener("click", f);

  var datas = Array.from(new Set(pts.map(function (p) { return p.x; }))).sort();

  box.append(svg, tip);

}

/* ============ LEITURA DE PRINT (OCR no aparelho, gratuito) ============ */
var CAMPOS = [
  {id: "seguidores", nome: "Seguidores", re: /^seguidores$|seguidores totais|total de seguidores|followers/i},
  {id: "seguindo", nome: "Seguindo", re: /^seguindo$|following/i},
  {id: "visualizacoes", nome: "Visualizações", re: /visualiza[cç](ões|oes|ao|ão)|views/i},
  {id: "alcance", nome: "Contas alcançadas", re: /contas alcan[cç]adas|alcance|reach/i},
  {id: "engajadas", nome: "Contas com engajamento", re: /contas com engajamento|engajad|engaged/i},
  {id: "interacoes", nome: "Interações", re: /intera[cç](ões|oes)|interactions/i},
  {id: "curtidas", nome: "Curtidas", re: /curtidas|likes/i},
  {id: "comentarios", nome: "Comentários", re: /coment[aá]rios|comments/i},
  {id: "salvamentos", nome: "Salvamentos", re: /salvamentos|salvos|saves/i},
  {id: "compartilhamentos", nome: "Compartilhamentos", re: /compartilhamentos|shares/i},
  {id: "visitas", nome: "Visitas ao perfil", re: /visitas ao perfil|visualiza[cç](ões|oes) do perfil|profile visits/i}
];
function numero(t) {
  var m = String(t).match(/(\d{1,3}(?:[.\s]\d{3})+|\d+(?:,\d+)?)\s*(mil|mi|k|m)?\b/i);
  if (!m) return null;
  var raw = m[1], mult = (m[2] || "").toLowerCase();
  var v = /[.\s]\d{3}/.test(raw) ? +raw.replace(/[.\s]/g, "") : +raw.replace(",", ".");
  if (mult === "mil" || mult === "k") v *= 1000; else if (mult === "mi" || mult === "m") v *= 1e6;
  return Math.round(v);
}
function extrair(texto) {
  var linhas = texto.split(/\n+/).map(function (l) { return l.trim(); }).filter(Boolean), out = {}, usada = {};
  var soNum = /^[+\-]?\s*\d[\d.,\s]*\s*(mil|mi|k|m)?\s*%?$/i;
  function pega(j) { if (j < 0 || j >= linhas.length || usada[j] || !soNum.test(linhas[j]) || /%$/.test(linhas[j])) return null; var x = numero(linhas[j]); if (x != null) usada[j] = true; return x; }
  linhas.forEach(function (l, i) {
    CAMPOS.forEach(function (c) {
      if (out[c.id] != null || !c.re.test(l)) return;
      var resto = l.replace(c.re, " "), v = /\d/.test(resto) && !/dias/i.test(resto) ? numero(resto) : null;
      if (v == null) v = pega(i + 1);
      if (v == null) v = pega(i - 1);
      if (v != null) out[c.id] = v;
    });
  });
  var per = texto.match(/(\d+)\s*dias/i); if (per) out.periodo = per[1] + " dias";
  if (/tiktok|visualiza[cç][oõ]es de v[ií]deo/i.test(texto)) out.rede = "TikTok";
  else if (/instagram|contas alcan/i.test(texto)) out.rede = "Instagram";
  return out;
}
var tess = null;
function carregarOCR() {
  if (tess) return tess;
  tess = new Promise(function (ok, erro) {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = function () { ok(window.Tesseract); }; s.onerror = function () { tess = null; erro(new Error("sem internet")); };
    document.head.append(s);
  });
  return tess;
}
async function lerPrint(file, status) {
  var T = await carregarOCR();
  status("Lendo o print… (a primeira vez demora um pouco)");
  var r = await T.recognize(file, "por+eng", {logger: function (m) { if (m.status === "recognizing text") status("Lendo o print… " + Math.round(m.progress * 100) + "%"); }});
  return r.data.text;
}

/* ============ TELAS ============ */
var TELAS = [
  {id: "hoje", nome: "Hoje", ico: "M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8"},
  {id: "metricas", nome: "Métricas", ico: "M4 20V10M10 20V4M16 20v-7M22 20H2"},

  {id: "pautas", nome: "Pautas", ico: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"},
  {id: "metas", nome: "Metas", ico: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"}
];
var atual = (location.hash || "#hoje").slice(1);
function nav() {
  var box = document.getElementById("nav"); box.replaceChildren();
  TELAS.forEach(function (t) {
    var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "path");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2"); svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");

  });

function ir(id) { atual = id; history.replaceState(null, "", "#" + id); render(); scrollTo(0, 0); }
function render() {
