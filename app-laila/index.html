<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4EEE6; --card:#FBF8F3; --ink:#1B1714; --soft:#6C625A; --rule:#DCD2C5;

}
@media (prefers-color-scheme: dark){:root{--paper:#14110F;--card:#1D1916;--ink:#F1EAE1;--soft:#A99E93;--rule:#38302A;--accent:#E07A4E;--sea:#7FC2BD;--ok:#7FCB9F;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  padding:0 max(20px,env(safe-area-inset-right)) 96px max(20px,env(safe-area-inset-left))}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto}
a{color:inherit}
/* cabeçalho de revista */
.mast{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 10px;border-bottom:2px solid var(--ink)}
.mast .nome{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.mast .ed{font-size:12px;max-width:45%;color:var(--soft);text-align:right}
.sub span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}.sub span:last-child{white-space:nowrap}.sub{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:6px 0 0;border-top:1px solid var(--rule);margin-top:2px}
.kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.02;text-wrap:balance}
.manchete{font-size:clamp(46px,13vw,72px);font-style:italic;margin:14px 0 18px;letter-spacing:-.01em}
h2{font-size:34px} h3{font-size:22px}
.quote{font-family:var(--serif);font-size:24px;line-height:1.25;font-style:italic;border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:0 0 22px}
.quote small{display:block;font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
section{padding:22px 0;border-bottom:1px solid var(--rule)}
section:last-child{border-bottom:0}
.passos{list-style:none;margin:12px 0 0;padding:0;counter-reset:p}
.passos li{counter-increment:p;display:grid;grid-template-columns:44px 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--rule)}
.passos li::before{content:counter(p,decimal-leading-zero);font-family:var(--serif);font-size:30px;line-height:1;color:var(--accent)}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:14px}
.meta b{color:var(--ink);font-weight:600}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:14px 10px;font:600 15px var(--sans);cursor:pointer;transition:background .15s,color .15s}
.btn.on{background:var(--ink);color:var(--paper)}
.btn.acc{border-color:var(--accent);color:var(--accent)} .btn.acc.on{background:var(--accent);color:#fff}
.btn.mini{padding:6px 14px;font-size:13px}
.prox{display:flex;gap:14px;align-items:baseline;cursor:pointer}
.prox .d{font-family:var(--serif);font-size:44px;line-height:1;color:var(--accent);min-width:56px}
.prox .t{font-family:var(--serif);font-size:22px;line-height:1.15}
.prox .p{font-size:12px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}
.indice .prox{padding:14px 0;border-top:1px solid var(--rule)}
.indice .prox.feito .t{text-decoration:line-through;color:var(--soft)}
.indice .prox.hoje .d{color:var(--sea)}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 8px;color:var(--sea);margin-left:6px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border-top:2px solid var(--ink)}
.nums div{padding:12px 8px 4px 0;border-right:1px solid var(--rule)} .nums div:last-child{border-right:0;padding-left:8px}
.nums div:nth-child(2){padding-left:8px}
.nums .v{font-family:var(--serif);font-size:38px;line-height:1;font-variant-numeric:lining-nums}
.nums .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.nums .x{font-size:12px;font-weight:600} .up{color:var(--ok)} .dn{color:var(--accent)}
.leitura{font-family:var(--serif);font-size:22px;line-height:1.35}
.leitura::first-letter{float:left;font-size:64px;line-height:.8;padding:6px 8px 0 0;color:var(--accent);font-weight:700}
.repita{background:var(--sea);color:#fff;border-radius:18px;padding:18px;margin-top:16px}
.repita .kick{color:#F7C9A9}
.repita div:last-child{font-family:var(--serif);font-size:24px;line-height:1.2;margin-top:4px}
.top li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--rule);align-items:baseline}
.top{list-style:none;margin:10px 0 0;padding:0}
.top .r{font-family:var(--serif);font-size:22px;color:var(--soft)}
.top .n{font-variant-numeric:tabular-nums;font-weight:600}
.top small{display:block;color:var(--soft);font-size:12px}
.barra{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:8px 0 2px}.barra i{display:block;height:100%;background:var(--accent)}
.barra.ok i{background:var(--ok)}
.mrow{padding:12px 0;border-top:1px solid var(--rule)}
.mrow .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow .h b{font-family:var(--serif);font-size:20px;font-weight:600}
.spark svg{width:100%;height:auto;display:block;margin-top:10px}
.spark text{fill:var(--soft);font:11px var(--sans)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--sea)}
.drop{border:1.5px dashed var(--rule);border-radius:16px;padding:18px;text-align:center;margin-top:12px;cursor:pointer}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--soft);gap:3px}
.form input,.form select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:9px 10px}
.idea{padding:14px 0;border-top:1px solid var(--rule)}
.idea .t{font-family:var(--serif);font-size:21px;line-height:1.2}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:12px}
.chip{flex:0 0 auto;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:13px var(--sans);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.estado{font-size:12px;color:var(--soft);margin-top:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:0 0 env(safe-area-inset-bottom)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{appearance:none;border:0;background:none;color:var(--soft);font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:16px 0;cursor:pointer}
nav.tabs button[aria-current=page]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;z-index:9}
.vazio{color:var(--soft);font-style:italic;font-family:var(--serif);font-size:20px}
</style></head>
