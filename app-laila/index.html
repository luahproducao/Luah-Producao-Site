<style>
/* Sistema visual LUAH · Universo de Marca */
:root{--g:#C5A059;--gl:#E8D08A;--gd:#8B6914;--ink:#06060C;--smoke:#F2EFE8;--muted:rgba(242,239,232,.55);--mut2:rgba(242,239,232,.28);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--smoke);font-family:var(--fb);font-weight:300}
body{min-height:100vh;
 background-image:radial-gradient(1px 1px at 12% 8%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1px 1px at 78% 14%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1.4px 1.4px at 44% 22%,rgba(232,208,138,.6),transparent 60%),radial-gradient(1px 1px at 88% 41%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 22% 47%,rgba(255,255,255,.3),transparent 60%),radial-gradient(1.2px 1.2px at 63% 63%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1px 1px at 8% 78%,rgba(232,208,138,.45),transparent 60%),radial-gradient(1px 1px at 92% 86%,rgba(255,255,255,.35),transparent 60%),radial-gradient(900px 500px at 50% -10%,rgba(197,160,89,.10),transparent 70%);
 background-attachment:fixed}
[hidden]{display:none!important}
.app{max-width:440px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 120px}
a{color:var(--gl)}
.lbl{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--g);font-weight:500}
.hint{font-size:12.5px;color:var(--muted);line-height:1.75}
.si{font-family:var(--fh);font-style:italic;font-weight:300}
.gc{background:linear-gradient(140deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:.5px solid var(--border);border-radius:var(--r);position:relative;overflow:hidden;padding:18px;margin-bottom:12px}
.gc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}

.gc.gold::before{background:linear-gradient(90deg,transparent,rgba(197,160,89,.85),transparent)}
/* topo */
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.brand{font-family:var(--fh);letter-spacing:.42em;font-size:13px;color:var(--g)}
.hello{font-family:var(--fh);font-style:italic;font-weight:300;font-size:34px;line-height:1.05;margin-top:6px}
.lvl{text-align:right;min-width:120px}
.lvl .n{font-family:var(--fh);font-size:15px;color:var(--gl)}
.xpw{background:rgba(255,255,255,.07);border-radius:50px;height:3px;overflow:hidden;margin-top:6px}
.xpb{height:100%;background:linear-gradient(90deg,var(--gd),var(--g),var(--gl));border-radius:50px;transition:width 1.2s ease}
/* dias */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -18px 6px;padding-left:18px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;border:.5px solid var(--border);border-radius:14px;background:rgba(255,255,255,.03);color:var(--smoke);padding:8px 0 7px;text-align:center;cursor:pointer;font-family:var(--fb)}
.day .w{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.day .d{font-family:var(--fh);font-size:24px;line-height:1.1}
.day .m{height:5px;width:5px;border-radius:50%;margin:3px auto 0;background:transparent}
.day.sel{border-color:var(--g);background:linear-gradient(160deg,rgba(197,160,89,.28),rgba(197,160,89,.06))}
.day.sel .w{color:var(--gl)}
.day.hj .d{color:var(--gl)}
.day .m.g{background:var(--g)} .day .m.p{background:var(--gr)}

.pilar{display:inline-flex;gap:6px;align-items:center}
.titulo{font-family:var(--fh);font-style:italic;font-weight:300;font-size:40px;line-height:1.02;margin:10px 0 14px}
.gancho{font-family:var(--fh);font-size:21px;line-height:1.3;color:var(--gl);border-left:1px solid var(--g);padding-left:14px}
.sec{margin-top:18px}
.passos{list-style:none;margin:10px 0 0;padding:0;counter-reset:p}

.passos li::before{content:counter(p,decimal-leading-zero);font-family:var(--fh);font-size:22px;line-height:1;color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:50px;font-size:11px;border:.5px solid var(--border);color:var(--muted);background:rgba(255,255,255,.03)}
.chip b{color:var(--smoke);font-weight:500}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{appearance:none;border:.5px solid var(--border2);background:rgba(197,160,89,.08);color:var(--gl);border-radius:50px;padding:15px 10px;font:500 11px var(--fb);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn.on{background:linear-gradient(135deg,var(--gd),var(--g));color:var(--ink);border-color:var(--g)}
.btn.ok.on{background:linear-gradient(135deg,#2E7D57,var(--gr));color:#fff;border-color:var(--gr)}
.btn.sm{padding:8px 16px;font-size:9.5px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal .h{font-size:9px;letter-spacing:.16em;text-align:center;color:var(--muted);text-transform:uppercase}
.cal .c{aspect-ratio:1;border-radius:12px;border:.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fh);font-size:18px;color:var(--mut2)}

.cal .c.hj{border-color:var(--g);color:var(--gl)}
.cal .c i{font-style:normal;font-size:8px;line-height:1;margin-top:2px;color:var(--g)}
.cal .c.post i{color:var(--gr)}
.lista .it{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:12px 0;border-top:.5px solid var(--border);cursor:pointer}
.lista .it .dn{font-family:var(--fh);font-size:30px;line-height:1;color:var(--g)}
.lista .it .t{font-family:var(--fh);font-size:20px;line-height:1.2}
.lista .it.post .t{color:var(--muted);text-decoration:line-through}
/* boletim */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.nums>div{border:.5px solid var(--border);border-radius:14px;padding:12px 10px;background:rgba(255,255,255,.03)}
.nums .v{font-family:var(--fh);font-size:30px;line-height:1;color:var(--gl)}
.nums .l{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.nums .x{font-size:11px;margin-top:4px;color:var(--mut2)} .up{color:var(--gr)!important} .dn{color:var(--rose)!important}
.leitura{font-family:var(--fh);font-style:italic;font-size:22px;line-height:1.35;margin:16px 0 0}
.top5{list-style:none;padding:0;margin:8px 0 0}

.top5 a{color:var(--smoke);text-decoration:none}
.meta{padding:12px 0;border-top:.5px solid var(--border)}

.spark svg{width:100%;height:auto;display:block;margin-top:12px}
.spark text{fill:var(--muted);font:10px var(--fb)}
details summary{cursor:pointer;list-style:none;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--g)}
details summary::after{content:' ＋'}
.drop{border:.5px dashed var(--border2);border-radius:14px;padding:18px;text-align:center;margin-top:12px;cursor:pointer;color:var(--gl);font-size:13px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.form input,.form select{font:14px var(--fb);color:var(--smoke);background:rgba(255,255,255,.05);border:.5px solid var(--border);border-radius:10px;padding:9px 10px}
.idea{padding:14px 0;border-top:.5px solid var(--border)}
.idea .t{font-family:var(--fh);font-size:21px;line-height:1.25;margin-top:4px}
.filtros{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.f{flex:0 0 auto;border:.5px solid var(--border);border-radius:50px;padding:6px 13px;font:400 11px var(--fb);color:var(--muted);background:transparent;cursor:pointer}
.f[aria-pressed=true]{border-color:var(--g);color:var(--gl);background:rgba(197,160,89,.12)}
/* navegação */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;display:flex;background:rgba(6,6,12,.96);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:.5px solid var(--border);padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
.bnav button{flex:1;appearance:none;border:0;background:none;color:var(--mut2);font:400 8.5px var(--fb);letter-spacing:.2em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.bnav button .ic{font-size:20px;line-height:1;font-family:var(--fh)}
.bnav button[aria-current=page]{color:var(--g)}
.bnav button[aria-current=page]::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--g)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:linear-gradient(135deg,var(--gd),var(--g));color:var(--ink);padding:9px 18px;border-radius:50px;font:500 11px var(--fb);letter-spacing:.12em;z-index:9;box-shadow:0 8px 30px rgba(197,160,89,.35)}
.vazio{font-family:var(--fh);font-style:italic;font-size:21px;color:var(--muted)}
.fade{animation:fd .45s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.xpb{transition:none}}
</style></head>
